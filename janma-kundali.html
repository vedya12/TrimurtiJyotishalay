<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>जन्म कुंडली | त्रिमूर्ती ज्योतिषालय</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Martel:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Martel',serif;background:#1a0a00;min-height:100vh;padding:20px;}
.page-header{text-align:center;color:#f0c060;margin-bottom:16px;}
.page-header h1{font-size:1.5rem;margin-bottom:4px;}
.page-header p{font-size:.85rem;color:#d4a060;opacity:.8;}
.btn-bar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.btn{padding:11px 26px;border:none;border-radius:30px;font-size:1rem;font-weight:700;
  font-family:'Martel',serif;cursor:pointer;transition:all .25s;}
.btn-dl{background:#8b1a1a;color:#fff;box-shadow:0 4px 16px rgba(139,26,26,.5);}
.btn-dl:hover{background:#5c0f0f;transform:translateY(-2px);}
.btn-cl{background:#555;color:#fff;}
.btn-cl:hover{background:#333;}
.hint{text-align:center;color:#c8a060;font-size:.82rem;margin-bottom:14px;opacity:.75;}

/* ── Template Box ── */
.template-wrap{display:flex;justify-content:center;}
.template-box{
  position:relative;
  width:794px;   /* A4 @ 96dpi */
  height:1123px;
  background:#fff;
  overflow:hidden;
}
.template-bg{position:absolute;inset:0;z-index:1;}
.template-bg img{width:100%;height:100%;object-fit:fill;display:block;}

/* ── Input fields overlaid on template ── */
.f{
  position:absolute;
  z-index:2;
  background:transparent;
  border:none;
  border-bottom:1.5px solid #8b4513;
  font-family:'Martel',serif;
  font-size:14px;
  color:#3b1f0b;
  padding:1px 4px;
  outline:none;
  text-align:left;
}
.f:focus{border-bottom:2px solid #c8860a;background:rgba(255,248,220,.5);}
.f.filled{border-bottom:1.5px solid transparent;background:transparent;}

select.f{cursor:pointer;-webkit-appearance:none;appearance:none;}
select.f option{background:#fff;color:#3b1f0b;}

/* ── House boxes on kundali chart ── */
.house{
  position:absolute;z-index:2;
  background:transparent;
  border:1.5px dashed rgba(139,69,19,.35);
  border-radius:4px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:11px;
  transition:all .2s;
  padding:3px;
  text-align:center;
}
.house:hover{border:1.5px solid #c8860a;background:rgba(200,134,10,.08);}
.house.filled{border:1.5px dashed transparent;}
.house .h-num{font-size:9px;color:#8b4513;font-weight:700;display:block;}
.house.filled .h-num{display:none;}
.house .h-rashi{font-size:15px;font-weight:700;color:#8b4513;display:none;}
.house.filled .h-rashi{display:block;}
.house .h-grahas{font-size:11px;color:#1a1a8b;font-weight:700;line-height:1.3;display:none;white-space:pre-line;}
.house.filled .h-grahas{display:block;}

/* ── Modal ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:900;}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:#fff;padding:24px;border-radius:14px;box-shadow:0 0 30px rgba(0,0,0,.45);
  z-index:1000;width:340px;max-width:95vw;}
.modal h3{color:#8b1a1a;text-align:center;margin-bottom:4px;font-size:1.1rem;}
.modal .sub{text-align:center;color:#888;font-size:.8rem;margin-bottom:14px;}
.modal label{display:block;font-weight:700;color:#5d4037;margin-bottom:6px;font-size:.85rem;}
.modal input[type=number]{width:100%;padding:10px;font-size:1rem;border:2px solid #4caf50;
  border-radius:6px;font-family:'Martel',serif;text-align:center;margin-bottom:14px;}
.graha-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.g-opt{display:flex;align-items:center;gap:6px;padding:8px 10px;border:2px solid #ddd;
  border-radius:8px;cursor:pointer;transition:all .2s;font-size:.9rem;}
.g-opt:hover{border-color:#4caf50;background:#f0fff0;}
.g-opt input{width:16px;height:16px;}
.modal-btns{display:flex;gap:10px;}
.m-btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:.9rem;
  font-weight:700;cursor:pointer;font-family:'Martel',serif;}
.m-ok{background:#8b1a1a;color:#fff;}
.m-ok:hover{background:#5c0f0f;}
.m-cancel{background:#eee;color:#333;border:2px solid #ccc;}
</style>
</head>
<body>
<div class="page-header">
  <h1>🕉 जन्म कुंडली</h1>
  <p>त्रिमूर्ती ज्योतिषालय | श्री. अभयराव जोशी महाराज</p>

  <a href="index.html" style="padding:11px 20px;background:#333;color:#f0c060;border-radius:30px;font-weight:700;font-size:.9rem;text-decoration:none;">← मुख्यपृष्ठ</a>

    <option>हस्त</option><option>चित्रा</option><option>स्वाति</option>

  <div class="house" data-h="7"  style="left:330px;top:565px;width:130px;height:60px;"><span class="h-num">भाव ७</span><span class="h-rashi"></span><span class="h-grahas"></span></div>
  <div class="house" data-h="8"  style="left:460px;top:555px;width:85px;height:55px;"><span class="h-num">भाव ८</span><span class="h-rashi"></span><span class="h-grahas"></span></div>

<!-- ══ MODAL ══ -->
<div class="overlay" id="ov"></div>
<div class="modal" id="modal">
  <h3>भाव सेटिंग</h3>
  <div class="sub" id="mSub">भाव क्रमांक १</div>
  <label>राशी क्रमांक (१–१२)</label>
  <input type="number" id="mRashi" min="1" max="12" placeholder="उदा: ५"/>
  <label>ग्रह निवडा:</label>
  <div class="graha-grid" id="mGrahas"></div>
  <div class="modal-btns">
    <button class="m-btn m-cancel" onclick="closeModal()">रद्द करा</button>
    <button class="m-btn m-ok"     onclick="saveHouse()">✓ सेट करा</button>
  </div>
</div>

<script>
const GRAHAS = ['सू','चं','मं','बु','गु','शु','श','रा','के'];
const hData  = {};
let curH     = null;

// Init houses
document.querySelectorAll('.house').forEach(el => {
  const h = el.dataset.h;
  hData[h] = {rashi:'', grahas:[]};
  el.addEventListener('click', () => openModal(h));
});

// Init input filled-state
document.querySelectorAll('.f').forEach(el => {
  const upd = () => el.classList.toggle('filled', !!el.value);
  el.addEventListener('input',  upd);
  el.addEventListener('change', upd);
  el.addEventListener('focus',  () => el.classList.remove('filled'));
  el.addEventListener('blur',   () => { if(el.value) el.classList.add('filled'); });
  if(el.value) el.classList.add('filled');
});

function openModal(h) {
  curH = h;
  document.getElementById('ov').style.display    = 'block';
  document.getElementById('modal').style.display = 'block';
  document.getElementById('mSub').textContent    = `भाव क्रमांक ${h}`;
  document.getElementById('mRashi').value        = hData[h].rashi;
  const grid = document.getElementById('mGrahas');
  grid.innerHTML = '';
  GRAHAS.forEach(g => {
    const chk = hData[h].grahas.includes(g);
    const d   = document.createElement('div');
    d.className = 'g-opt';
    d.innerHTML = `<input type="checkbox" id="g_${g}" value="${g}" ${chk?'checked':''}/>
                   <label for="g_${g}">${g}</label>`;
    grid.appendChild(d);
  });
  setTimeout(() => document.getElementById('mRashi').focus(), 80);
}

function closeModal() {
  document.getElementById('ov').style.display    = 'none';
  document.getElementById('modal').style.display = 'none';
  curH = null;
}

function saveHouse() {
  if(!curH) return;
  const rashi  = document.getElementById('mRashi').value.trim();
  const grahas = [...document.querySelectorAll('#mGrahas input:checked')].map(c => c.value);
  hData[curH]  = {rashi, grahas};
  const el     = document.querySelector(`.house[data-h="${curH}"]`);
  el.querySelector('.h-rashi').textContent  = rashi;
  el.querySelector('.h-grahas').textContent = grahas.join('\n');
  el.classList.toggle('filled', !!(rashi || grahas.length));
  closeModal();
}

document.getElementById('ov').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function clearAll() {
  if(!confirm('सर्व डेटा हटवायचा आहे का?')) return;
  document.querySelectorAll('.f').forEach(el => { el.value=''; el.classList.remove('filled'); });
  document.querySelectorAll('.house').forEach(el => {
    const h = el.dataset.h;
    hData[h] = {rashi:'', grahas:[]};
    el.querySelector('.h-rashi').textContent  = '';
    el.querySelector('.h-grahas').textContent = '';
    el.classList.remove('filled');
  });
}

async function downloadPDF() {
  const btn = document.querySelector('.btn-dl');
  btn.textContent = '⏳ PDF तयार होत आहे...';
  btn.disabled    = true;
  try {
    // Hide all edit indicators before capture
    document.querySelectorAll('.f').forEach(el => {
      el.classList.add('filled');
      if(el.tagName==='SELECT') el.style.backgroundImage = 'none';
    });
    document.querySelectorAll('.house').forEach(el => el.classList.add('filled'));
    document.querySelector('.btn-bar').style.display  = 'none';
    document.querySelector('.hint').style.display     = 'none';
    document.querySelector('.page-header').style.display = 'none';

    // Wait for bg image
    await new Promise(r => {
      const img = document.getElementById('bgImg');
      if(img.complete && img.naturalWidth) r();
      else { img.onload = r; img.onerror = r; }
    });

    const canvas = await html2canvas(document.getElementById('tbox'), {
      scale: 2, useCORS: true, backgroundColor: '#ffffff',
      width: 794, height: 1123
    });

    const pdf = new jspdf.jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
    pdf.save('जन्म_कुंडली.pdf');
  } catch(e) { alert('PDF Error: ' + e.message); }
  finally {
    document.querySelector('.btn-bar').style.display  = '';
    document.querySelector('.hint').style.display     = '';
    document.querySelector('.page-header').style.display = '';
    document.querySelectorAll('.f').forEach(el => {
      if(!el.value) el.classList.remove('filled');
      if(el.tagName==='SELECT') el.style.backgroundImage = '';
    });
    document.querySelectorAll('.house').forEach(el => {
      const h = el.dataset.h;
      if(!hData[h].rashi && !hData[h].grahas.length) el.classList.remove('filled');
    });
    btn.textContent = '📄 PDF डाउनलोड करा';
    btn.disabled    = false;
  }
}
</script>
<script type="module" src="/src/scripts/kundali-guard.js"></script>
</body>
