<script>

const GRAHAS = ["सू","चं","मं","बु","गु","शु","श","रा","के"];

let hData = {};
let curH = null;
let centers = {};
let boxes = {};

// initialize 12 houses + compute centroid & bbox of each polygon for label placement
for(let i=1;i<=12;i++){
    hData[i] = { rashi:"", grahas:[] };

    let poly = document.getElementById("h"+i);
    let pts = poly.getAttribute("points").trim().split(/\s+/).map(p=>{
        let [x,y] = p.split(",").map(Number);
        return {x,y};
    });

    let cx = pts.reduce((s,p)=>s+p.x,0) / pts.length;
    let cy = pts.reduce((s,p)=>s+p.y,0) / pts.length;

    centers[i] = {x:cx, y:cy};

    let bb = poly.getBBox();
    boxes[i] = {w: bb.width, h: bb.height};

    let textEl = document.getElementById("t"+i);
    if(textEl) textEl.setAttribute("clip-path", "url(#clip"+i+")");
}

function updateHouseDisplay(h){
    let el = document.getElementById("t"+h);
    let poly = document.getElementById("h"+h);
    if(!el) return;

    el.innerHTML = "";

    let d = hData[h];

    if(!d.rashi && d.grahas.length === 0){
        if(poly) poly.classList.remove("filled-house");
        return;
    }

    if(poly) poly.classList.add("filled-house");

    let box = boxes[h] || {w:100, h:100};

    // approx usable width/height inside the house shape (shapes are triangular/
    // diamond so true usable area is smaller than the full bbox)
    let usableW = box.w * 0.55;
    let usableH = box.h * 0.55;

    // decide how many grahas fit per line based on usable width
    let avgCharW = 8; // rough estimate at 13px font
    let perLine = Math.max(1, Math.floor(usableW / (avgCharW * 2.4)));

    let grahaLines = [];
    for(let i=0; i<d.grahas.length; i+=perLine){
        grahaLines.push(d.grahas.slice(i, i+perLine).join(" "));
    }

    let totalLines = (d.rashi ? 1 : 0) + grahaLines.length;

    // shrink font size as line count grows, and further shrink if usable
    // height can't fit the lines at base size
    let baseSize = 13;
    let lineHeight = baseSize + 3;

    if(totalLines > 1){
        let maxLineHeight = usableH / totalLines;
        lineHeight = Math.min(lineHeight, Math.max(8, maxLineHeight));
    }

    let fontSize = Math.max(7, Math.min(baseSize, lineHeight - 2));
    let rashiFontSize = Math.max(fontSize, fontSize + 2);

    let lines = [];
    if(d.rashi) lines.push({text:d.rashi, cls:"rashi-line", size:rashiFontSize});
    grahaLines.forEach(gl=>lines.push({text:gl, cls:"", size:fontSize}));

    let startDy = -((lines.length - 1) * lineHeight) / 2;

    lines.forEach((line, idx)=>{
        let tspan = document.createElementNS("http://www.w3.org/2000/svg","tspan");
        tspan.setAttribute("x", centers[h].x);
        tspan.setAttribute("y", centers[h].y + startDy + (idx*lineHeight));
        tspan.setAttribute("font-size", line.size);
        if(line.cls) tspan.setAttribute("class", line.cls);
        tspan.textContent = line.text;
        el.appendChild(tspan);
    });
}

// input filled state
document.querySelectorAll(".f").forEach(el=>{
    const update = () => {
        if(el.value) el.classList.add("filled");
        else el.classList.remove("filled");
    };
    el.addEventListener("input", update);
    el.addEventListener("change", update);
});

// Restrict राशी क्रमांक field to 1-12 in real time
const mRashiEl = document.getElementById("mRashi");

// Given one house's rashi, auto-derive the rashi for all 12 houses since
// houses always run in a fixed sequence around the chart (wrapping 12 -> 1)
function autoFillRashiSequence(anchorHouse, anchorRashi){
    for(let i=1;i<=12;i++){
        let offset = ((i - anchorHouse) % 12 + 12) % 12;
        let r = ((anchorRashi - 1 + offset) % 12) + 1;
        hData[i].rashi = String(r);
    }
}

mRashiEl.addEventListener("input", function(){
    let v = this.value;

    if(v === "") return;

    let n = Number(v);

    if(!Number.isInteger(n) || n < 1 || n > 12){
        alert("राशी क्रमांक १ ते १२ च्या दरम्यानच असू शकतो.");
        this.value = "";
    }
});

mRashiEl.addEventListener("keydown", function(e){
    // block +, -, e, ., and any character that could push the value beyond 2 digits
    if(["e","E","+","-","."].includes(e.key)) e.preventDefault();
});

function getUsedGrahas(excludeHouse){
    let used = new Set();

    for(let i=1;i<=12;i++){
        if(i === excludeHouse) continue;
        hData[i].grahas.forEach(g=>used.add(g));
    }

    return used;
}

function openModal(h){
    curH = h;

    document.getElementById("ov").style.display = "block";
    document.getElementById("modal").style.display = "block";

    document.getElementById("mSub").innerHTML = "भाव क्रमांक " + h;
    document.getElementById("mRashi").value = hData[h].rashi;

    let grid = document.getElementById("mGrahas");
    grid.innerHTML = "";

    let usedElsewhere = getUsedGrahas(h);

    GRAHAS.forEach(g=>{
        if(usedElsewhere.has(g)) return;

        let checked = hData[h].grahas.includes(g) ? "checked" : "";
        grid.innerHTML += `
        <label class="g-opt">
        <input type="checkbox" value="${g}" ${checked}>
        ${g}
        </label>
        `;
    });

    if(grid.innerHTML.trim() === ""){
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#999;font-size:.8rem;">सर्व ग्रह आधीच इतर भावांमध्ये निवडले आहेत</div>`;
    }
}

function closeModal(){
    document.getElementById("ov").style.display = "none";
    document.getElementById("modal").style.display = "none";
    curH = null;
}

document.getElementById("ov").onclick = closeModal;

function saveHouse(){
    if(!curH) return;

    let rashiInput = document.getElementById("mRashi");
    let rashiVal = rashiInput.value.trim();

    let grahas = [];

    document.querySelectorAll("#mGrahas input:checked").forEach(x=>{
        grahas.push(x.value);
    });

    if(rashiVal !== ""){
        let n = Number(rashiVal);

        if(!Number.isInteger(n) || n < 1 || n > 12){
            alert("कृपया राशी क्रमांक १ ते १२ च्या दरम्यानच टाका.");
            rashiInput.focus();
            return;
        }

        // auto-fill every house's rashi based on this house as the anchor
        autoFillRashiSequence(curH, n);
    }
    else{
        // user cleared this house's own rashi - just clear this one house,
        // leave the rest of the sequence untouched
        hData[curH].rashi = "";
    }

    hData[curH].grahas = grahas;

    for(let i=1;i<=12;i++){
        updateHouseDisplay(i);
    }

    closeModal();
}

function clearAll(){
    if(!confirm("सर्व डेटा हटवायचा आहे का?")) return;

    document.querySelectorAll(".f").forEach(el=>{
        el.value = "";
        el.classList.remove("filled");
    });

    for(let i=1;i<=12;i++){
        hData[i] = { rashi:"", grahas:[] };
        updateHouseDisplay(i);
    }
}

async function downloadPDF(){
    const btn = document.querySelector(".btn-dl");

    btn.innerHTML = "⏳ PDF तयार होत आहे...";
    btn.disabled = true;

    try{
        document.querySelector(".btn-bar").style.display = "none";
        document.querySelector(".hint").style.display = "none";

        const canvas = await html2canvas(
            document.getElementById("tbox"),
            { scale:2, useCORS:true, backgroundColor:"#fff" }
        );

        const pdf = new jspdf.jsPDF("portrait","mm","a4");

        pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, 210, 297);

        pdf.save("जन्म_कुंडली.pdf");
    }
    catch(e){
        alert("PDF Error : "+e.message);
    }
    finally{
        document.querySelector(".btn-bar").style.display = "flex";
        document.querySelector(".hint").style.display = "block";

        btn.innerHTML = "📄 PDF डाउनलोड करा";
        btn.disabled = false;
    }
}
