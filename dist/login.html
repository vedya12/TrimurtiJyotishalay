<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>लॉगिन | त्रिमूर्ती ज्योतिषालय</title>
  <link rel="icon" href="/logo.png" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet"/>
  <script type="module" crossorigin src="/assets/login-BA65BTj4.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-Bz0haH2D.js">
  <link rel="stylesheet" crossorigin href="/assets/auth-CZhpOv5s.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-logo">
    <img src="/logo.png" alt="त्रिमूर्ती ज्योतिषालय"/>
    <h1>त्रिमूर्ती ज्योतिषालय</h1>
    <p>तुमचे आभारी आहोत. कृपया लॉगिन करा.</p>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active">लॉगिन</button>
      <a href="register.html" class="auth-tab" style="text-decoration:none;">नोंदणी</a>
    </div>

    <div class="auth-error" id="authError"></div>

    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label>ईमेल</label>
        <input type="email" id="loginEmail" required placeholder="तुमचा ईमेल"/>
      </div>
      <div class="form-group">
        <label>पासवर्ड</label>
        <input type="password" id="loginPassword" required placeholder="तुमचा पासवर्ड"/>
      </div>
      <button type="submit" class="btn-auth" id="loginBtn">लॉगिन करा →</button>
    </form>

    <div class="auth-footer">
      खाते नाही? <a href="register.html">नोंदणी करा</a>
    </div>
  </div>

  <div class="back-home">
    <a href="/">← मुख्यपृष्ठावर जा</a>
  </div>
</div>

</body>
</html>
